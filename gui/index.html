<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zappy — Graphic Client</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
        background: #081109;
        color: #cfe8d8;
      }
      header {
        display: flex;
        gap: 1.5rem;
        align-items: baseline;
        padding: 0.6rem 1rem;
        background: #0c1b12;
        border-bottom: 1px solid #1f3b29;
      }
      header h1 {
        font-size: 1rem;
        margin: 0;
        font-weight: 600;
      }
      .field {
        font-size: 0.85rem;
        color: #8fb8a0;
      }
      .field span {
        color: #cfe8d8;
      }
      #status[data-status="open"] span {
        color: #57d98a;
      }
      #status[data-status="error"] span,
      #status[data-status="closed"] span {
        color: #e0776b;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #map {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      #tile-overlay {
        position: fixed;
        z-index: 10;
        min-width: 11rem;
        max-width: 16rem;
        padding: 0.65rem 0.75rem 0.5rem;
        background: #0f2218;
        border: 1px solid #2f5a40;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        color: #cfe8d8;
        pointer-events: none;
      }
      #tile-overlay[hidden] {
        display: none;
      }
      #tile-overlay h2 {
        margin: 0 0 0.4rem;
        font-size: 0.85rem;
        font-weight: 600;
      }
      #tile-overlay ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #tile-overlay li {
        display: grid;
        grid-template-columns: 0.7rem 1fr auto;
        gap: 0.45rem;
        align-items: center;
        font-size: 0.8rem;
        padding: 0.12rem 0;
      }
      #tile-overlay li .swatch {
        width: 0.65rem;
        height: 0.65rem;
        border-radius: 2px;
        border: 1px solid #06140c;
      }
      #tile-overlay li .count {
        font-variant-numeric: tabular-nums;
        color: #ffe66d;
      }
      #tile-overlay li[data-stone="true"] .name {
        color: #e8fff0;
      }
      .tile-overlay-players {
        margin: 0.45rem 0 0;
        font-size: 0.75rem;
        color: #8fb8a0;
      }
      .tile-overlay-hint {
        margin: 0.35rem 0 0;
        font-size: 0.65rem;
        color: #5f8570;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Zappy · Minerth</h1>
      <div class="field" id="status" data-status="connecting">
        connection: <span>starting…</span>
      </div>
      <div class="field">map: <span id="dims">—</span></div>
    </header>
    <main id="stage">
      <canvas id="map"></canvas>
    </main>
    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
