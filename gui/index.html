<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zappy — Graphic Client</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
        background: #081109;
        color: #cfe8d8;
      }
      header {
        display: flex;
        gap: 1.5rem;
        align-items: baseline;
        padding: 0.6rem 1rem;
        background: #0c1b12;
        border-bottom: 1px solid #1f3b29;
      }
      header h1 {
        font-size: 1rem;
        margin: 0;
        font-weight: 600;
      }
      .field {
        font-size: 0.85rem;
        color: #8fb8a0;
      }
      .field span {
        color: #cfe8d8;
      }
      #status[data-status="open"] span {
        color: #57d98a;
      }
      #status[data-status="error"] span,
      #status[data-status="closed"] span {
        color: #e0776b;
      }
      main {
        flex: 1;
        min-height: 0;
      }
      #map {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Zappy · Minerth</h1>
      <div class="field" id="status" data-status="connecting">
        connection: <span>starting…</span>
      </div>
      <div class="field">map: <span id="dims">—</span></div>
    </header>
    <main>
      <canvas id="map"></canvas>
    </main>
    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
